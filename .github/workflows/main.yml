name: Build X-Chess APK (Manual)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses-dev libffi-dev libssl-dev \
          cmake

    - name: Install python-for-android
      run: |
        pip install --upgrade pip
        pip install cython
        pip install git+https://github.com/kivy/python-for-android.git

    - name: Build APK with p4a
      run: |
        p4a apk \
          --requirements=python3,kivy,plyer,pyjnius,android \
          --bootstrap=sdl2 \
          --package=org.example.xchess \
          --name=X-Chess \
          --version=1.0.0 \
          --ndk-api=21 \
          --android-api=30 \
          --ndk-version=26c \
          --arch=arm64-v8a \
          --arch=armeabi-v7a \
          --copy-libs \
          --ignore-setup-py \
          --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: X-Chess-APK
        path: *.apk
